spring.datasource.url=jdbc:postgresql://localhost:5432/postingAdvertisements
spring.datasource.username=advertisements
spring.datasource.password=advertisements
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

image.avatars.dir=images/avatars/
image.ads.dir=images/ads/
image.base.url=/images

